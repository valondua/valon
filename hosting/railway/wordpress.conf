<Directory /data/.valon-state-v1/wordpress>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<Files "wp-config.php">
    Require all denied
</Files>
# Private migration snapshots and readiness markers never have public URL access.
<LocationMatch "(?i)(?:^|/)\.valon-state-v1(?:/|$)">
    Require all denied
</LocationMatch>
