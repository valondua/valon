name: valon-rebuild
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-only-wordpress
      MARIADB_ROOT_PASSWORD: local-only-root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      retries: 20
  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - "127.0.0.1:8094:80"
    env_file: &wp-env-file
      - path: .env
        required: false
    environment: &wp-environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-only-wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
        if (!defined('WP_DEBUG')) define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes: &wp-volumes
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/themes/valon
      - ./plugins/valon-platform:/var/www/html/wp-content/plugins/valon-platform
    depends_on:
      db:
        condition: service_healthy
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    env_file: *wp-env-file
    environment: *wp-environment
    volumes: *wp-volumes
    depends_on:
      - wordpress
    profiles: [tools]
  scheduler:
    image: wordpress:cli-php8.3
    user: "33:33"
    env_file: *wp-env-file
    environment: *wp-environment
    volumes: *wp-volumes
    entrypoint: [/bin/sh, -c]
    command:
      [
        "while true; do wp cron event run --due-now --path=/var/www/html; sleep 60; done",
      ]
    depends_on:
      - wordpress
volumes:
  db:
  wordpress:
